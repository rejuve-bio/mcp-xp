services:
  app:
    build:
      context: .
    platform: linux/amd64
    container_name: mcp-app
    env_file:
      - .env
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - APP_PORT=${APP_PORT}
      - MCP_PORT=${MCP_PORT}
      - REDIS_PORT=${REDIS_PORT}
      - REDIS_HOST=redis
      - QDRANT_HOST=qdrant
      - QDRANT_HTTP_PORT=${QDRANT_HTTP_PORT}
      - CURRENT_LLM=${CURRENT_LLM:-openai} # Set current LLM to run the MCP server with, defaults to openai.
      - CURRENT_EMBEDDER=${CURRENT_EMBEDDER}
      - MONGO_HOST=mongo
      - MONGO_PORT=${MONGO_PORT}
    ports:
      - "127.0.0.1:${APP_PORT}:8895" # Uvicorn
      - "127.0.0.1:${MCP_PORT}:8897" # bioblend_server
    depends_on:
      - redis
      - qdrant
      - mongo
    volumes:
      - ./logs:/app/logs
      - ./state:/app/state
    networks:
      - default
      - rejuve-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    platform: linux/amd64
    container_name: redis
    command: ["redis-server", "--port", "${REDIS_PORT}"]
    ports:
      - "127.0.0.1:${REDIS_PORT}:${REDIS_PORT}"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant
    platform: linux/amd64
    container_name: qdrant
    environment:
      - QDRANT__SERVICE__HTTP_PORT=${QDRANT_HTTP_PORT}
      - QDRANT__SERVICE__GRPC_PORT=${QDRANT_GRPC_PORT}
    ports:
      - "127.0.0.1:${QDRANT_HTTP_PORT}:${QDRANT_HTTP_PORT}" # HTTP
      - "127.0.0.1:${QDRANT_GRPC_PORT}:${QDRANT_GRPC_PORT}" # gRPC
    volumes:
      - vectordata:/qdrant/storage
    restart: unless-stopped

  mongo:
    image: mongo:latest
    platform: linux/amd64
    container_name: mongo
    command: ["mongod", "--bind_ip_all", "--port", "${MONGO_PORT}"]
    ports:
      - "127.0.0.1:${MONGO_PORT}:${MONGO_PORT}"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

volumes:
  vectordata:
  redis_data:
  mongo_data:

networks:
  default:
  rejuve-network:
    external: true
