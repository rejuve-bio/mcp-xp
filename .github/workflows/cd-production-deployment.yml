name: CD - Blue-green deploy to production

on:
  repository_dispatch:
    types: [deploy-production]
  workflow_dispatch:
    inputs:
      action:
        description: Deploy staging-stable or switch back to the previous color
        required: true
        type: choice
        options: [deploy, rollback]
        default: deploy

permissions:
  contents: read

concurrency:
  group: mcp-xp-production-deployment
  cancel-in-progress: false

env:
  IMAGE_REPOSITORY: rejuvebio/mcp-xp
  STABLE_IMAGE: rejuvebio/mcp-xp:staging-stable
  NAMESPACE: mcp-xp-production
  DEPLOYMENT_NAME: mcp-app
  CONTAINER_NAME: mcp-app
  LIVE_SERVICE: mcp-app
  PREVIEW_SERVICE: mcp-app-preview
  CONTAINER_PORT: "8895"
  LOCAL_PORT: "18896"
  HEALTH_PATH: /

jobs:
  deploy:
    if: github.event_name == 'repository_dispatch' || inputs.action == 'deploy'
    runs-on: self-hosted
    steps:
      - name: Checkout current repository
        uses: actions/checkout@v4

      - name: Setup kubectl
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_PRODUCTION }}" > ~/.kube/config
          chmod 600 ~/.kube/config
          echo "KUBECONFIG=$HOME/.kube/config" >> "$GITHUB_ENV"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Resolve staging-stable to an immutable digest
        id: image
        run: |
          docker pull "$STABLE_IMAGE"
          IMAGE="$(docker image inspect "$STABLE_IMAGE" --format '{{index .RepoDigests 0}}')"
          test -n "$IMAGE"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Deploy staging-stable and validate inactive color
        id: candidate
        env:
          ACTION: prepare
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          chmod +x scripts/blue_green_deploy.sh
          scripts/blue_green_deploy.sh

      - name: Switch production traffic to validated color
        env:
          ACTION: switch
          TARGET_SLOT: ${{ steps.candidate.outputs.target-slot }}
        run: scripts/blue_green_deploy.sh

      - name: Show active color
        run: |
          kubectl get service "$LIVE_SERVICE" -n "$NAMESPACE" \
            -o jsonpath='Active slot: {.spec.selector.app\.kubernetes\.io/slot}{"\n"}'
          kubectl get deployments -n "$NAMESPACE" \
            -l app.kubernetes.io/name=mcp-app

      - name: Send success email
        if: success()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: CD Blue-Green SUCCESS - mcp-xp production promoted
          to: ${{ secrets.RECIEVER_EMAIL }}
          from: GitHub Actions <${{ secrets.EMAIL_USERNAME }}>
          body: Production traffic switched to the validated staging-stable image.

      - name: Send failure email
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: CD Blue-Green FAILED - inspect mcp-xp production
          to: ${{ secrets.RECIEVER_EMAIL }}
          from: GitHub Actions <${{ secrets.EMAIL_USERNAME }}>
          body: The production deployment workflow failed. Review the logs and active Service selector before retrying.

  rollback:
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'rollback'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Setup kubectl
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_PRODUCTION }}" > ~/.kube/config
          chmod 600 ~/.kube/config
          echo "KUBECONFIG=$HOME/.kube/config" >> "$GITHUB_ENV"

      - name: Validate previous color and switch traffic back
        env:
          ACTION: rollback
        run: |
          chmod +x scripts/blue_green_deploy.sh
          scripts/blue_green_deploy.sh
