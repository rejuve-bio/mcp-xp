name: CI - Build and publish staging image

on:
  push:
    branches: [staging]

permissions:
  contents: write

concurrency:
  group: mcp-xp-staging-image
  cancel-in-progress: false

env:
  IMAGE_REPOSITORY: rejuvebio/mcp-xp

jobs:
  build-publish-dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and publish immutable and staging tags
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            rejuvebio/mcp-xp:sha-${{ github.sha }}
            rejuvebio/mcp-xp:staging
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Dispatch immutable image to staging
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createDispatchEvent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              event_type: "deploy-staging",
              client_payload: { image_tag: `sha-${context.sha}` }
            });
