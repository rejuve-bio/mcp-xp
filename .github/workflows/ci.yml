name: Continuous Integration

on:
  push:
    branches:
      - staging
      - "feat/**"
      - "fix/**"
  pull_request:
    branches:
      - staging

jobs:
  lint-and-test:
    name: Lint and Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Add uv to PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Cache uv artifacts
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Sync dependencies
        run: uv sync --frozen --extra dev

      - name: Lint with flake8
        run: |
          uv run flake8 . \
            --exclude=.venv,__pycache__,.git,.mypy_cache,.pytest_cache,build,dist \
            --count --select=E9,F63,F7,F82 --show-source --statistics

          uv run flake8 . \
            --exclude=.venv,__pycache__,.git,.mypy_cache,.pytest_cache,build,dist \
            --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics \
            --format='%(path)s:%(row)d:%(col)d: %(code)s %(text)s'
            
      - name: Run tests with coverage
        env:
          SECRET_KEY: this-is-a-dummy-key-for-ci-only-1234567890==
          GALAXY_URL: http://test-galaxy
          GALAXY_API_KEY: test-galaxy-key
          GALAXY_SCRAPING_URL: http://test-galaxy
          GALAXY_SCRAPING_API_KEY: test-galaxy-scraping-key
          APP_PORT: "8895"
          MCP_PORT: "8897"
          REDIS_PORT: "6389"
          QDRANT_HTTP_PORT: "6555"
          QDRANT_GRPC_PORT: "6556"
          MONGO_PORT: "28018"
        run: |
          chmod +x ./run_tests.sh
          ./run_tests.sh

      - name: Smoke import runtime libraries
        run: |
          uv run python -c "import bioblend, fastapi, fastmcp, httpx, openai, qdrant_client, redis"

      - name: Upload XML coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

      - name: Upload HTML coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: htmlcov
