name: CI - Docker build check

# Verifies the production Dockerfile builds on every push, on any branch.
# No image is pushed anywhere — this is a pre-flight that catches broken
# Dockerfiles / missing files / dependency resolution errors before they
# reach a real deploy.

on:
  push:
    branches:
      - '**'

permissions:
  contents: read

jobs:
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build production image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: mcp-xp:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Report
        run: |
          echo "✓ Dockerfile builds successfully."
          docker images | grep mcp-xp | head -3
