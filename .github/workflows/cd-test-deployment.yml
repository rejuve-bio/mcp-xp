name: CD Test - dry-run deploy simulation

# A shape-check for the real deploy workflows.  Runs on a
# github-hosted ubuntu runner, has no environment scope, echoes
# what the real workflow WOULD do instead of touching a cluster.
#
# Trigger from any branch (Actions → CD Test → Run workflow).  Useful
# for:
#   - validating YAML changes before promoting them into the real
#     cd-staging/cd-production files,
#   - confirming a repository_dispatch payload shape reaches the job,
#   - sanity-checking the target/namespace/tag interpolation.
#
# No secrets are read, no cluster is contacted, no email is sent.

on:
  # Fires on every push to this branch — the only trigger type that
  # actually runs a workflow whose file is not yet on the default
  # branch.  Once the file lands on develop, workflow_dispatch and
  # repository_dispatch below become usable too.
  push:
    branches:
      - feat/deploy-test-workflow
  workflow_dispatch:
    inputs:
      target:
        description: "Simulate deploy to which environment"
        default: "staging"
        type: choice
        options:
          - staging
          - production
      image_tag:
        description: "Image tag to simulate deploying"
        default: "test"
  repository_dispatch:
    types:
      - test-deploy
      - test-deploy-staging
      - test-deploy-production

permissions:
  contents: read

jobs:
  simulate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current repository
        uses: actions/checkout@v4

      - name: Compute deploy vars
        id: vars
        run: |
          set -euo pipefail
          case "${{ github.event_name }}" in
            workflow_dispatch)
              TARGET="${{ inputs.target }}"
              TAG="${{ inputs.image_tag }}"
              ;;
            repository_dispatch)
              ACTION="${{ github.event.action }}"
              case "$ACTION" in
                *production*) TARGET="production" ;;
                *)            TARGET="staging" ;;
              esac
              TAG="${{ github.event.client_payload.image_tag }}"
              if [ -z "$TAG" ]; then
                TAG="$TARGET"
              fi
              ;;
            push)
              # push trigger — no inputs, no payload.  Default to staging
              # + the short SHA as the "image tag" so we can see the
              # substitution works with real values.
              TARGET="staging"
              TAG="sha-$(git rev-parse --short HEAD)"
              ;;
            *)
              TARGET="staging"
              TAG="unknown"
              ;;
          esac
          NAMESPACE="mcp-xp-${TARGET}"
          {
            echo "target=$TARGET"
            echo "namespace=$NAMESPACE"
            echo "tag=$TAG"
          } >> "$GITHUB_OUTPUT"
          echo "event:  ${{ github.event_name }}"
          echo "ref:    ${{ github.ref }}"
          echo "actor:  ${{ github.actor }}"
          echo "target: $TARGET"
          echo "ns:     $NAMESPACE"
          echo "tag:    $TAG"

      - name: Simulate kubectl setup
        run: |
          echo "would write ~/.kube/config from secrets.KUBECONFIG"

      - name: Simulate kubectl set image
        run: |
          echo "would run:"
          echo "  kubectl set image deployment/mcp-app \\"
          echo "    mcp-app=rejuvebio/mcp-xp:${{ steps.vars.outputs.tag }} \\"
          echo "    -n ${{ steps.vars.outputs.namespace }}"

      - name: Simulate rollout wait
        run: |
          echo "would run:"
          echo "  kubectl rollout status deployment/mcp-app \\"
          echo "    -n ${{ steps.vars.outputs.namespace }} --timeout=180s"

      - name: Simulate pod verification
        run: |
          echo "would run:"
          echo "  kubectl get pods -n ${{ steps.vars.outputs.namespace }}"

      - name: Summary
        run: |
          echo "dry-run complete"
          echo "  target    : ${{ steps.vars.outputs.target }}"
          echo "  namespace : ${{ steps.vars.outputs.namespace }}"
          echo "  image tag : ${{ steps.vars.outputs.tag }}"
          echo "  event     : ${{ github.event_name }}"
          echo "  ref       : ${{ github.ref }}"
